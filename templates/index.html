<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Crypto Tool</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Consolas, Monaco, monospace;
        }
        body {
            background-color: #12151c;
            color: #e2e8f0;
            max-width: 820px;
            margin: 30px auto;
            padding: 0 16px;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 6px;
        }
        p.sub {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .box {
            background: #1e2330;
            border: 1px solid #2e3648;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        textarea, input, select {
            width: 100%;
            background: #0f1218;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            font-size: 14px;
            outline: none;
        }
        textarea:focus, input:focus, select:focus {
            border-color: #38bdf8;
        }
        .row {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        .row > div {
            flex: 1;
        }
        .btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 14px;
        }
        button {
            padding: 10px 12px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: #0f172a;
            transition: opacity 0.15s;
        }
        button:hover {
            opacity: 0.88;
        }
        .c1 { background-color: #38bdf8; }
        .c2 { background-color: #a78bfa; }
        .c3 { background-color: #fbbf24; }
        .c4 { background-color: #34d399; }
        .btn-swap {
            background-color: #475569;
            color: #f8fafc;
            margin-top: 10px;
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
        }
        .error {
            color: #f87171;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <h2>Mini Crypto Decoder</h2>
    <p class="sub">Công cụ giải mã cổ điển: Hex / XOR / ROT / Vigenère / Caesar</p>

    <div class="box">
        <label for="inputText">Chuỗi đầu vào (Input):</label>
        <textarea id="inputText" rows="4" placeholder="Nhập chuỗi cần mã hóa hoặc giải mã..."></textarea>

        <div class="row">
            <div>
                <label for="keyInput">Khóa (Key / Bước dịch k):</label>
                <input type="text" id="keyInput" placeholder="VD: 3 (Caesar), mykey (XOR/Vigenere), 0x20...">
            </div>
            <div>
                <label for="modeSelect">Chế độ (cho Caesar & Vigenère):</label>
                <select id="modeSelect">
                    <option value="decrypt">Giải mã (Decrypt)</option>
                    <option value="encrypt">Mã hóa (Encrypt)</option>
                </select>
            </div>
        </div>

        <div class="btn-group">
            <button class="c1" onclick="runCrypto('hextobytes')">1. Hex -> Bytes</button>
            <button class="c1" onclick="runCrypto('tobinary')">1. To Binary (0/1)</button>
            <button class="c1" onclick="runCrypto('xor')">1. XOR</button>
            <button class="c2" onclick="runCrypto('rot')">2. ROT (1 -> 25)</button>
            <button class="c3" onclick="runCrypto('vigenere')">3. Vigenère</button>
            <button class="c4" onclick="runCrypto('caesar')">4. Caesar</button>
        </div>

        <div id="errorMsg" class="error"></div>
    </div>

    <div class="box">
        <label for="outputText">Kết quả (Output):</label>
        <textarea id="outputText" rows="6" readonly placeholder="Kết quả sẽ hiện ở đây..."></textarea>
        <button class="btn-swap" onclick="useOutputAsInput()">Đưa Output lên làm Input tiếp</button>
    </div>

    <script>
        async function runCrypto(action) {
            const text = document.getElementById("inputText").value;
            const key = document.getElementById("keyInput").value;
            const mode = document.getElementById("modeSelect").value;
            const errorBox = document.getElementById("errorMsg");
            const outputBox = document.getElementById("outputText");

            errorBox.style.display = "none";

            const response = await fetch("/run", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text, action, key, mode })
            });

            const data = await response.json();

            if (data.ok) {
                outputBox.value = data.result;
            } else {
                errorBox.innerText = "Lỗi: " + data.error;
                errorBox.style.display = "block";
            }
        }

        function useOutputAsInput() {
            const out = document.getElementById("outputText").value;
            if (out) {
                document.getElementById("inputText").value = out;
            }
        }
    </script>

</body>
</html>
